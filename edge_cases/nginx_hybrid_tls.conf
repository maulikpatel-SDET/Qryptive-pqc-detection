# TC-25  Config file: TLS 1.3 with hybrid PQC key-exchange group (OpenSSL 3.5+).
# Expected: Qryptive recognises X25519MLKEM768 as hybrid post-quantum,
# not as plain ECC / ECDH.
server {
    listen 443 ssl;
    server_name pqc-test.example.com;

    ssl_certificate     /etc/ssl/certs/test.crt;
    ssl_certificate_key /etc/ssl/private/test.key;
    ssl_protocols       TLSv1.3;
    ssl_ecdh_curve      X25519MLKEM768;
}
